name: CI
run-name: CI / ${{ inputs.jobs }}

# 2026-10-03 adjudicated design (cancel CI dependency pins): the
# landing-date node pins (workspace, devkit, foundation, math) are
# REMOVED. Every dispatch names its own candidate (required, full
# 40-hex-char SHA of this repo's commit under test) and an optional
# workspace_ref for deliberate old-graph reproduction (absent =
# workspace default branch head). The resolve job reads
# workspace.lock.json at that workspace ref and every node checkout
# rides the resolved lock SHAs; no node pins live in this file.

on:
  workflow_dispatch:
    inputs:
      jobs:
        description: >-
          Validation units: full, or comma-separated IDs: win-debug, win-release, gcc-debug, gcc-release,
          clang-debug, clang-release, mac-x64-debug, mac-x64-release, mac-arm64-debug, mac-arm64-release, contracts
        required: true
        default: full
        type: string
      candidate:
        description: >-
          Full 40-hex-char SHA of the qiven-math commit under test
        required: true
        type: string
      workspace_ref:
        description: >-
          Optional qiven-workspace ref for deliberate old-graph reproduction;
          absent = workspace default branch head
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve:
    name: Resolve run graph (candidate + workspace lock)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      candidate: ${{ steps.candidate.outputs.candidate }}
      workspace_commit: ${{ steps.identity.outputs.workspace_commit }}
      devkit_sha: ${{ steps.lock.outputs.devkit_sha }}
      foundation_sha: ${{ steps.lock.outputs.foundation_sha }}
    steps:
      - name: Validate candidate admission (typed)
        id: candidate
        shell: bash
        env:
          CANDIDATE: ${{ inputs.candidate }}
        run: |
          set -euo pipefail
          if [[ ! "$CANDIDATE" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "[FAIL] resolve/candidate: WHAT: the candidate input is malformed"
            echo "  or missing - it must be the exact full 40-hex-char SHA of the"
            echo "  qiven-math commit under test"
            echo "  WHY: a dispatch must name the exact head under test; a silent"
            echo "  branch-head fallback would validate an unstated graph - the"
            echo "  defect class this redesign eliminates (rule: math/ci-resolve)"
            echo "  EVIDENCE: received candidate input string: \"$CANDIDATE\""
            echo "  NEXT action: FIX - re-dispatch with the full 40-char SHA of the"
            echo "  intended head; this workflow never falls back to a branch head"
            exit 1
          fi
          echo "candidate=${CANDIDATE,,}" >> "$GITHUB_OUTPUT"

      - name: Checkout workspace control (dispatch ref or default)
        uses: actions/checkout@v6
        with:
          repository: JasonHuang3D/qiven-workspace
          ref: ${{ inputs.workspace_ref }}
          path: qiven-workspace

      - name: Resolve dependency graph from the workspace lock
        id: lock
        shell: bash
        env:
          LOCK_NODE_MAP: qiven-devkit=devkit_sha qiven-foundation=foundation_sha
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          lock_path = "qiven-workspace/workspace.lock.json"
          try:
              with open(lock_path, encoding="utf-8") as handle:
                  lock = json.load(handle)
          except Exception as error:
              print(f"error: WHAT: cannot read the workspace lock at {lock_path}:"
                f" {error}", file=sys.stderr)
              print("error: WHY: the dispatch graph is resolved from the lock;"
                " an unreadable lock has no fallback (rule: math/ci-resolve)",
                file=sys.stderr)
              print(f"error: EVIDENCE: {type(error).__name__}: {error}", file=sys.stderr)
              print("error: NEXT action: DIAGNOSE - inspect the dispatched"
                " workspace ref (rule: math/ci-resolve)", file=sys.stderr)
              sys.exit(1)
          if lock.get("schema") != "qiven-workspace-lock-v1":
              print("error: WHAT: unsupported lock schema", file=sys.stderr)
              print("error: WHY: the resolver reads only the admitted"
                " qiven-workspace-lock-v1 shape; schema drift is a typed"
                " stop, never a best-effort parse (rule: math/ci-resolve)",
                file=sys.stderr)
              print("error: EVIDENCE: schema=" + repr(lock.get("schema")),
                file=sys.stderr)
              print("error: NEXT action: DIAGNOSE - inspect the dispatched"
                " workspace ref (rule: math/ci-resolve)", file=sys.stderr)
              sys.exit(1)
          pairs = [item.split("=", 1) for item in os.environ["LOCK_NODE_MAP"].split()]
          resolved = {}
          unresolved = []
          evidence = []
          for node, key in pairs:
              commit = lock.get("nodes", {}).get(node, {}).get("commit")
              if commit and re.fullmatch(r"[0-9a-f]{40}", commit):
                  resolved[key] = commit
              else:
                  unresolved.append(node)
                  evidence.append(f"{node}={commit!r}")
          if unresolved:
              print("error: WHAT: the lock does not resolve node(s): "
                  + ", ".join(sorted(unresolved)), file=sys.stderr)
              print("error: WHY: the dispatch graph must be fully stated by the"
                  " lock; an unresolved node has no fallback"
                  " (rule: math/ci-resolve)", file=sys.stderr)
              print("error: EVIDENCE: workspace.lock.json node entries: "
                  + ", ".join(sorted(evidence)), file=sys.stderr)
              print("error: NEXT action: DIAGNOSE - inspect workspace.lock.json"
                  " at the dispatched workspace ref", file=sys.stderr)
              sys.exit(1)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for key, sha in resolved.items():
                  print(f"{key}={sha}", file=output)
          PY

      - name: Record run identity (this echo is the record)
        id: identity
        shell: bash
        env:
          CANDIDATE: ${{ steps.candidate.outputs.candidate }}
          WORKSPACE_REF: ${{ inputs.workspace_ref }}
          DEVKIT_SHA: ${{ steps.lock.outputs.devkit_sha }}
          FOUNDATION_SHA: ${{ steps.lock.outputs.foundation_sha }}
        run: |
          set -euo pipefail
          workspace_commit="$(git -C qiven-workspace rev-parse HEAD)"
          if [[ -z "$WORKSPACE_REF" ]]; then
            workspace_ref_used="default"
          else
            workspace_ref_used="$WORKSPACE_REF"
          fi
          echo "run identity (record):"
          echo "  candidate: $CANDIDATE"
          echo "  workspace_ref used: $workspace_ref_used"
          echo "  workspace commit (lock source): $workspace_commit"
          echo "  dependency graph (node -> resolved SHA):"
          echo "    qiven-devkit -> $DEVKIT_SHA"
          echo "    qiven-foundation -> $FOUNDATION_SHA"
          echo "workspace_commit=$workspace_commit" >> "$GITHUB_OUTPUT"

  plan:
    name: Validation plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      windows: ${{ steps.plan.outputs.windows }}
      unix: ${{ steps.plan.outputs.unix }}
      run_windows: ${{ steps.plan.outputs.run_windows }}
      run_unix: ${{ steps.plan.outputs.run_unix }}
      run_contracts: ${{ steps.plan.outputs.run_contracts }}
      selected: ${{ steps.plan.outputs.selected }}
    steps:
      - name: Resolve requested validation units
        id: plan
        shell: bash
        env:
          REQUESTED_JOBS: ${{ inputs.jobs }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          allowed = [
              "win-debug", "win-release", "gcc-debug", "gcc-release", "clang-debug", "clang-release",
              "mac-x64-debug", "mac-x64-release", "mac-arm64-debug", "mac-arm64-release", "contracts",
          ]
          raw = os.environ["REQUESTED_JOBS"].strip()
          if raw == "full":
              selected = allowed
          else:
              requested = [item.strip() for item in raw.split(",") if item.strip()]
              if not requested or "full" in requested:
                  print("error: WHAT: the jobs input is malformed - it must be "
                        "'full' or a comma-separated list of validation unit "
                        "IDs (allowed: " + ", ".join(allowed) + ")",
                        file=sys.stderr)
                  print("error: WHY: the plan is the typed admission surface - an "
                        "unrecognized request would validate nothing while appearing "
                        "to run CI (rule: math/ci-plan)", file=sys.stderr)
                  print("error: EVIDENCE: received jobs input string: "
                        + repr(os.environ["REQUESTED_JOBS"]), file=sys.stderr)
                  print("error: NEXT action: FIX - re-dispatch with jobs=full or a "
                        "subset of: " + ", ".join(allowed), file=sys.stderr)
                  sys.exit(1)
              unknown = sorted(set(requested) - set(allowed))
              if unknown:
                  print("error: WHAT: unknown validation unit(s): "
                        + ", ".join(unknown) + " (allowed: "
                        + ", ".join(allowed) + ")", file=sys.stderr)
                  print("error: WHY: an unknown unit name cannot map to any matrix "
                        "leg; the run would be vacuous (rule: math/ci-plan)",
                        file=sys.stderr)
                  print("error: EVIDENCE: received jobs input string: "
                        + repr(os.environ["REQUESTED_JOBS"]) + "; unknown "
                        "token(s): " + ", ".join(unknown), file=sys.stderr)
                  print("error: NEXT action: FIX - correct the unit name from: "
                        + ", ".join(allowed) + ", then re-dispatch", file=sys.stderr)
                  sys.exit(1)
              selected = [item for item in allowed if item in set(requested)]
          windows = []
          if "win-debug" in selected:
              windows.append({"build_type": "Debug"})
          if "win-release" in selected:
              windows.append({"build_type": "Release"})
          definitions = {
              "gcc-debug": ["Linux GCC x64", "ubuntu-24.04", "gcc", "g++", "Debug"],
              "gcc-release": ["Linux GCC x64", "ubuntu-24.04", "gcc", "g++", "Release"],
              "clang-debug": ["Linux Clang x64", "ubuntu-24.04", "clang", "clang++", "Debug"],
              "clang-release": ["Linux Clang x64", "ubuntu-24.04", "clang", "clang++", "Release"],
              "mac-x64-debug": ["macOS AppleClang x64", "macos-15-intel", "clang", "clang++", "Debug"],
              "mac-x64-release": ["macOS AppleClang x64", "macos-15-intel", "clang", "clang++", "Release"],
              "mac-arm64-debug": ["macOS AppleClang arm64", "macos-15", "clang", "clang++", "Debug"],
              "mac-arm64-release": ["macOS AppleClang arm64", "macos-15", "clang", "clang++", "Release"],
          }
          unix = [
              {"name": value[0], "os": value[1], "cc": value[2], "cxx": value[3], "build_type": value[4]}
              for item, value in definitions.items() if item in selected
          ]
          outputs = {
              "windows": json.dumps(windows, separators=(",", ":")),
              "unix": json.dumps(unix, separators=(",", ":")),
              "run_windows": str(bool(windows)).lower(),
              "run_unix": str(bool(unix)).lower(),
              "run_contracts": str("contracts" in selected).lower(),
              "selected": ",".join(selected),
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for key, value in outputs.items():
                  print(f"{key}={value}", file=output)
          PY

  windows:
    name: Windows MSVC x64 / ${{ matrix.build_type }}
    needs: [plan, resolve]
    if: ${{ needs.plan.outputs.run_windows == 'true' }}
    runs-on: windows-2022
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.windows) }}
    steps:
      # CI validates the DISPATCH-STATED graph (2026-10-03 pin
      # cancellation): the control repository rides the resolve job's
      # lock read, the candidate is the dispatch input, and every
      # dependency node checkout rides the SHAs resolved from
      # workspace.lock.json. No node pins live in this file. The
      # workspace-path migration itself is WR-3 continuation (v29);
      # per-platform presets remain a WR-5-class follow-up.
      - name: Checkout workspace control (lock-read revision)
        uses: actions/checkout@v6
        with:
          repository: JasonHuang3D/qiven-workspace
          ref: ${{ needs.resolve.outputs.workspace_commit }}
          path: qiven-workspace
      - name: Checkout locked Devkit
        uses: actions/checkout@v6
        with:
          repository: JasonHuang3D/qiven-devkit
          ref: ${{ needs.resolve.outputs.devkit_sha }}
          path: qiven-devkit
      - name: Checkout locked Foundation
        uses: actions/checkout@v6
        with:
          repository: JasonHuang3D/qiven-foundation
          ref: ${{ needs.resolve.outputs.foundation_sha }}
          path: qiven-foundation
      - name: Checkout math candidate (dispatch)
        uses: actions/checkout@v6
        with:
          repository: JasonHuang3D/qiven-math
          ref: ${{ needs.resolve.outputs.candidate }}
          path: qiven-math
      - name: Configure (workspace bootstrap)
        run: >-
          python qiven-workspace/bootstrap/qiven-bootstrap.py gate-configure
          --control qiven-workspace --devkit qiven-devkit
          --repo qiven-math --repo-root qiven-math
          --preset vs2022-x64 --cmake cmake
      - name: Build
        run: cmake --build qiven-math/build/vs2022-x64 --config ${{ matrix.build_type }} --parallel
      - name: Test
        run: ctest --test-dir qiven-math/build/vs2022-x64 -C ${{ matrix.build_type }} --output-on-failure

  unix:
    name: ${{ matrix.name }} / ${{ matrix.build_type }}
    needs: [plan, resolve]
    if: ${{ needs.plan.outputs.run_unix == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.unix) }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      # WR-3 continuation (v29): per-platform presets are a WR-5-class
      # follow-up (CMakePresets define vs2022-x64 only); this unit is an
      # honest typed skip until they land.
      - name: Workspace path status
        run: >
          echo "[SKIP] unix: the workspace-path CI migration covers the supported
          platform (windows). Per-platform presets are a WR-5-class follow-up;
          this run validates nothing for unix."

  contracts:
    name: Linux Clang / no exceptions / no RTTI / ASan+UBSan
    needs: [plan, resolve]
    if: ${{ needs.plan.outputs.run_contracts == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CC: clang
      CXX: clang++
      CXXFLAGS: -fno-exceptions -fno-rtti -fsanitize=address,undefined -fno-omit-frame-pointer
      LDFLAGS: -fsanitize=address,undefined
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      # WR-3 continuation (v29): the contract profile (no exceptions / no
      # RTTI / sanitizers) needs per-platform presets on the workspace path -
      # a WR-5-class follow-up; honest typed skip until they land.
      - name: Workspace path status
        run: >
          echo "[SKIP] contracts: the workspace-path CI migration covers the
          supported platform (windows). Contract-profile presets are a
          WR-5-class follow-up; this run validates nothing for contracts."

  ci-gate:
    name: CI Gate
    if: ${{ always() }}
    needs: [resolve, plan, windows, unix, contracts]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify requested validation results
        shell: bash
        env:
          RESOLVE_RESULT: ${{ needs.resolve.result }}
          PLAN_RESULT: ${{ needs.plan.result }}
          RUN_WINDOWS: ${{ needs.plan.outputs.run_windows }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          RUN_UNIX: ${{ needs.plan.outputs.run_unix }}
          UNIX_RESULT: ${{ needs.unix.result }}
          RUN_CONTRACTS: ${{ needs.plan.outputs.run_contracts }}
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
          SELECTED: ${{ needs.plan.outputs.selected }}
        run: |
          set -euo pipefail
          ok=0
          [[ "$RESOLVE_RESULT" == "success" ]] || ok=1
          [[ "$PLAN_RESULT" == "success" ]] || ok=1
          [[ "$RUN_WINDOWS" != "true" || "$WINDOWS_RESULT" == "success" ]] || ok=1
          [[ "$RUN_UNIX" != "true" || "$UNIX_RESULT" == "success" ]] || ok=1
          [[ "$RUN_CONTRACTS" != "true" || "$CONTRACTS_RESULT" == "success" ]] || ok=1
          if [[ "$ok" != "0" ]]; then
            echo "[FAIL] CI Gate: WHAT: a requested validation unit did not succeed"
            echo "  WHY: the conclusion is the enforcement; the unix and contracts"
            echo "  units are honest typed [SKIP]s until per-platform presets land -"
            echo "  a skip validates nothing and is never a pass (rule: math/ci-gate)"
            echo "  EVIDENCE: resolve=${RESOLVE_RESULT}, plan=${PLAN_RESULT},"
            echo "  windows=${WINDOWS_RESULT}, unix=${UNIX_RESULT},"
            echo "  contracts=${CONTRACTS_RESULT}; requested units: ${SELECTED}"
            echo "  NEXT action: DIAGNOSE - open the failed unit's step logs, classify"
            echo "  the failure (resolve/plan admission, configure, build, test), fix"
            echo "  it at the validated revisions, then re-dispatch; a re-dispatch"
            echo "  without a fix is not a retry."
            exit 1
          fi
          echo "Requested validation passed: $SELECTED"
